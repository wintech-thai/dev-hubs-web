<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 700" width="440" height="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- connectors -->
  <line x1="220" y1="92" x2="220" y2="140" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrowhead)"/>
  <rect x="98" y="110" width="244" height="21" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="220" y="124.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.1">Operator watch detects it</text>

  <line x1="220" y1="222" x2="220" y2="255" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrowhead)"/>

  <line x1="220" y1="369" x2="220" y2="417" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrowhead)"/>
  <rect x="70" y="387" width="300" height="21" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="220" y="401.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.1">Secret is mounted into the pod</text>

  <line x1="220" y1="531" x2="220" y2="564" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrowhead)"/>

  <!-- Step 1: create ServiceMonitor -->
  <rect x="20" y="20" width="400" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="49" font-size="14.5" font-weight="700" fill="#0f172a">You create a ServiceMonitor</text>
  <text x="44" y="70" font-size="12.5" fill="#64748b">Declares which Service to scrape, and how</text>

  <!-- Step 2: Operator converts -->
  <rect x="20" y="150" width="400" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="179" font-size="14.5" font-weight="700" fill="#0f172a">Operator converts the ServiceMonitor</text>
  <text x="44" y="200" font-size="12.5" fill="#64748b">Every match becomes a scrape config</text>

  <!-- Step 3: writes config / secret -->
  <rect x="20" y="265" width="400" height="102" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="294" font-size="14.5" font-weight="700" fill="#0f172a">Written into a single config file</text>
  <text x="44" y="315" font-size="12.5" fill="#64748b">Stored in a Secret named</text>
  <text x="44" y="335" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#334155">prometheus-prometheus-prometheus</text>

  <!-- Step 4: config-reloader sidecar -->
  <rect x="20" y="427" width="400" height="102" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="456" font-size="14.5" font-weight="700" fill="#0f172a">config-reloader sidecar</text>
  <text x="44" y="477" font-size="12.5" fill="#64748b">The 2nd container in the pod — the one showing 2/2</text>
  <text x="44" y="497" font-size="12.5" fill="#64748b">Detects the file change, then POST /-/reload</text>

  <!-- Step 5: Prometheus loads new config -->
  <rect x="20" y="574" width="400" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="603" font-size="14.5" font-weight="700" fill="#0f172a">Prometheus loads the new config</text>
  <text x="44" y="624" font-size="12.5" fill="#64748b">Begins scraping the newly added target</text>

  <text x="220" y="678" text-anchor="middle" font-size="10.5" fill="#94a3b8" letter-spacing="0.3">PROMETHEUS OPERATOR — RECONCILE LOOP</text>
</svg>
