<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Application backup and restore architecture</title>
<desc id="desc">Database and application files are collected by a backup Pod and uploaded to object storage through S3. The backup Pod reports the outcome to Discord. A local restore script downloads and validates the backup before returning data to the application Pods.</desc>
