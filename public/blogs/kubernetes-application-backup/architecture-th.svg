.section{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:700}.detail{font-size:18px;fill:#172033}.caption{font-size:17px;fill:#172033}.boundary{fill:none;stroke:#2e7d32;stroke-width:1}.node{stroke-width:1}.flow{fill:none;stroke:#505765;stroke-width:1.5;marker-end:url(#arrow)}
</style>
